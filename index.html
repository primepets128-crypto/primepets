<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Pets | Trusted Pet Store Online</title>
    <meta name="description" content="Discover a wide range of pet products at Prime Pets. Shop online for pet food, toys, grooming, accessories, and more." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prime Pets | Trusted Pet Store Online" />
    <meta property="og:description" content="Discover a wide range of pet products at Prime Pets. Shop online for pet food, toys, grooming, accessories, and more." />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prime Pets | Trusted Pet Store Online" />
    <meta name="twitter:description" content="Discover a wide range of pet products at Prime Pets. Shop online for pet food, toys, grooming, accessories, and more." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <!-- Preload the LCP logo image -->
    <link rel="preload" href="/MA_logo.webp" as="image" type="image/webp" />
    <!-- Preconnect to Firebase so auth/iframe loads faster -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://primepets-75a7f.firebaseapp.com" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root">
      <!-- Instant Initial Page Loader (Raw HTML & CSS) -->
      <style>
        #initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #1a0e05 0%, #3d1f0a 50%, #5c3110 100%);
          z-index: 99999;
          font-family: sans-serif;
          margin: 0;
          padding: 0;
        }
        .loader-logo-container {
          position: relative;
          width: 130px;
          height: 130px;
          background: white;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 0 30px rgba(208, 126, 32, 0.4);
          animation: loader-pulse 2s infinite ease-in-out;
          margin-bottom: 20px;
        }
        .loader-logo-container img {
          width: 80px;
          height: 80px;
          object-fit: contain;
        }
        .loader-title {
          font-size: 22px;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 0.15em;
          color: #ffd8a8;
          margin-bottom: 20px;
          text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .loader-bar-container {
          width: 140px;
          height: 4px;
          background: rgba(0,0,0,0.4);
          border-radius: 999px;
          overflow: hidden;
        }
        .loader-bar-fill {
          height: 100%;
          width: 30%;
          background: linear-gradient(90deg, #ffd8a8, #d07e20);
          border-radius: 999px;
          animation: loader-progress 1.4s infinite ease-in-out;
        }
        @keyframes loader-pulse {
          0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(208, 126, 32, 0.4); }
          50% { transform: scale(1.03); box-shadow: 0 0 45px rgba(208, 126, 32, 0.6); }
        }
        @keyframes loader-progress {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(350%); }
        }
      </style>
      <div id="initial-loader">
        <div class="loader-logo-container">
          <picture>
            <source srcset="/MA_logo.webp" type="image/webp" />
            <img src="/MA_logo.png" alt="Logo" />
          </picture>
        </div>
        <div class="loader-title">Prime Pets</div>
        <div class="loader-bar-container">
          <div class="loader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
